function box(w,h,d,x,y,z,mat,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, y+h/2, z);
  (parent||scene).add(m);
  return m;
}
function hipRoof(w,d,h,x,y,z,mat,parent){
  const r = Math.hypot(w,d)/2;
  const g = new THREE.CylinderGeometry(r*0.18, r, h, 4);
  const m = new THREE.Mesh(g, mat);
  m.rotation.y = Math.atan2(d,w);
  m.position.set(x, y+h/2, z);
  (parent||scene).add(m);
  return m;
}
function hall(w,d,bh,rh,x,z,roof,parent,y){
  y = y||0;
  box(w,bh,d,x,y,z,M.plaster,parent);
  hipRoof(w*1.12,d*1.12,rh,x,y+bh,z,roof,parent);
}
function gateTower(x,z,along,roof,parent,scale){
  const s = scale||1;
  const w = along==='x'?3.2*s:1.8*s, d = along==='x'?1.8*s:3.2*s;
  box(w,1.2*s,d,x,0,z,M.wall,parent);
  hall(w*0.8, d*0.8, 0.7*s, 0.6*s, x, z, roof||M.roofImp, parent, 1.2*s);
}
function wallRect(x0,z0,x1,z1,h,t,mat,parent){
  const cx=(x0+x1)/2, cz=(z0+z1)/2, w=x1-x0, d=z1-z0;
  box(w+t,h,t,cx,0,z0,mat,parent);
  box(w+t,h,t,cx,0,z1,mat,parent);
  box(t,h,d-t,x0,0,cz,mat,parent);
  box(t,h,d-t,x1,0,cz,mat,parent);
}
function tree(x,z,s,parent){
  s=s||1;

  const c=new THREE.Mesh(new THREE.ConeGeometry(0.55*s,1.2*s,7),M.tree);
  c.position.set(x,0.5*s+0.6*s,z);(parent||scene).add(c);
}

const reserved = [];
function addWardGrid(x0,x1,z0,z1,nc,nr){
  const gap=0.6;
  const cw=((x1-x0)-(nc-1)*gap)/nc, rh=((z1-z0)-(nr-1)*gap)/nr;
  for(let i=0;i<nc;i++)for(let j=0;j<nr;j++){
    const ax=x0+i*(cw+gap), az=z0+j*(rh+gap);
    const bx=ax+cw, bz=az+rh;
    let skip=false;
    for(const r of reserved){
      if(ax<r[2]+0.2 && bx>r[0]-0.2 && az<r[3]+0.2 && bz>r[1]-0.2){skip=true;break;}
    }
    if(skip)continue;
    const h=0.22+((i*7+j*13)%5)*0.02;
    box(cw,h,rh,(ax+bx)/2,0,(az+bz)/2,((i+j)%2)?M.ward:M.ward2);
  }
  return {cw,rh,gap};
}

const cam={theta:0,phi:0.52,dist:150,tx:0,ty:0,tz:2};
let anim=null;
function applyCam(){
  cam.phi=Math.max(0.12,Math.min(1.45,cam.phi));
  cam.dist=Math.max(6,Math.min(260,cam.dist));
  const sp=Math.sin(cam.phi);
  camera.position.set(
    cam.tx+cam.dist*sp*Math.sin(cam.theta),
    cam.ty+cam.dist*Math.cos(cam.phi),
    cam.tz+cam.dist*sp*Math.cos(cam.theta));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
const views={
  bird:   {theta:0,   phi:0.52,dist:150,tx:0,   ty:0,tz:2},
  huang:  {theta:0.12,phi:1.02,dist:46, tx:0,   ty:0,tz:-27},
  xing:   {theta:1.75,phi:0.95,dist:21, tx:43,  ty:0,tz:-8.4},
  zhuque: {theta:0.02,phi:1.28,dist:34, tx:0,   ty:0.8,tz:8},
  daming: {theta:-0.35,phi:0.95,dist:34,tx:12,  ty:0,tz:-53},
  qujiang:{theta:0.9, phi:1.0, dist:26, tx:39,  ty:0,tz:36}
};
function goTo(v){
  const from={...cam}, to=views[v], t0=performance.now();
  let dth=to.theta-from.theta;
  while(dth>Math.PI)dth-=2*Math.PI; while(dth<-Math.PI)dth+=2*Math.PI;
  anim=(now)=>{
    let k=Math.min(1,(now-t0)/900);
    k=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    cam.theta=from.theta+dth*k;
    cam.phi=from.phi+(to.phi-from.phi)*k;
    cam.dist=from.dist+(to.dist-from.dist)*k;
    cam.tx=from.tx+(to.tx-from.tx)*k;
    cam.ty=from.ty+(to.ty-from.ty)*k;
    cam.tz=from.tz+(to.tz-from.tz)*k;
    if(k>=1)anim=null;
  };
}

let lastPinch=0,lastMid=null;
el.style.touchAction='none';
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('pointerdown',e=>{
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button});
  anim=null;
});
el.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);lastPinch=0;lastMid=null;});
el.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);lastPinch=0;lastMid=null;});
function panBy(dx,dy){
  const s=cam.dist*0.0016;
  const st=Math.sin(cam.theta),ct=Math.cos(cam.theta);
  cam.tx-=(dx*ct - dy*st)*s;
  cam.tz-=(-dx*st - dy*ct)*s;
}
el.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){
    if(p.btn===2||p.btn===1){panBy(dx,dy);}
    else{cam.theta-=dx*0.005;cam.phi-=dy*0.004;}
  }else if(ptrs.size===2){
    const arr=[...ptrs.values()];
    const d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
    const mid={x:(arr[0].x+arr[1].x)/2,y:(arr[0].y+arr[1].y)/2};
    if(lastPinch)cam.dist*=lastPinch/d;
    if(lastMid)panBy(mid.x-lastMid.x,mid.y-lastMid.y);
    lastPinch=d;lastMid=mid;
  }
});
el.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist*=Math.pow(1.0016,e.deltaY);
  anim=null;
},{passive:false});

function resize(){
  const w=app.clientWidth,h=app.clientHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const tmp=new THREE.Vector3();
function render(now){
  requestAnimationFrame(render);
  if(anim)anim(now);
  applyCam();
  renderer.render(scene,camera);
  const w=app.clientWidth,h=app.clientHeight;
  const show=ck1.checked;
  for(const L of labels){
    let vis=show&&(!L.dm||dm.visible)&&(!L.min||cam.dist<L.min);
    if(vis){
      tmp.copy(L.v).project(camera);
      if(tmp.z>1||tmp.z<-1)vis=false;
      else{
        L.el.style.left=((tmp.x*0.5+0.5)*w)+'px';
        L.el.style.top=((-tmp.y*0.5+0.5)*h)+'px';
      }
    }
    L.el.style.display=vis?'block':'none';
  }
}
requestAnimationFrame(render);
</script>
</body>
</html>
